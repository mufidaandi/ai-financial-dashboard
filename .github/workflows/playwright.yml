name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      # server/src/config/db.js reads MONGO_URI (note: server/.env.example
      # documents MONGODB_URI instead — see TESTING_STRATEGY.md).
      MONGO_URI: mongodb://localhost:27017/financial-dashboard-ci
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      CORS_ORIGINS: http://localhost:5173
      PORT: 3000
      NODE_ENV: development
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install root dependencies
      run: npm ci
    - name: Install client dependencies
      run: npm ci
      working-directory: client
    - name: Install server dependencies
      run: npm ci
      working-directory: server
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
